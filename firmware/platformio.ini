[platformio]
; Prefer explicit node envs via `uv run hotbox-firmware-* --node-id N`.
default_envs = nano_esp32_node0

; Shared Nano ESP32 settings. Flash via nano_esp32_node{0,1,2} only.
[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Encoder
    br3ttb/PID
; CAN uses built-in ESP32-S3 TWAI (`driver/twai.h`) in src/can_bus.cpp — not sandeepmistry/CAN.

[env:nano_esp32_node0]
extends = env:nano_esp32
build_flags =
    -D HOTBOX_NODE_ID=0

[env:nano_esp32_node1]
extends = env:nano_esp32
build_flags =
    -D HOTBOX_NODE_ID=1

[env:nano_esp32_node2]
extends = env:nano_esp32
build_flags =
    -D HOTBOX_NODE_ID=2

# ── Native C-in-the-loop (CIL) build ─────────────────────────────────────────
# Compiles the firmware control code for the host OS as a shared library (.so /
# .dylib) so the Python SITL can load it via ctypes and exercise the exact same
# PID + stall-detection code that runs on the ESP32.
#
# Build:  cd firmware && pio run -e native_cil
# Output: firmware/.pio/build/native_cil/libfirmware_cil.so  (Linux)
#         firmware/.pio/build/native_cil/libfirmware_cil.dylib  (macOS)
[env:native_cil]
platform = native
build_type = debug
build_flags =
    -std=c++17
    -shared
    -fPIC
    -I include
    -I native/include
    -D HOTBOX_NODE_ID=0
    -D NATIVE_CIL
build_src_filter =
    -<*>
    +<../native/firmware_cil.cpp>
    +<axis.cpp>
    +<protocol.cpp>
