# Hot-Box plant / geometry constants
# Shared by controller, sim_in_the_loop, sim_full_raytrace, and (via generated header) firmware.
# Edit this file rather than hardcoding values in Python or C++.

default_site:
  # Diemoz, France
  latitude_deg: 45.5885
  longitude_deg: 5.0904
  altitude_m: 380.0
  timezone_id: Europe/Paris
#  # Berkeley, California
#  latitude_deg: 37.8716
#  longitude_deg: -122.2585
#  altitude_m: 186.0
#  timezone_id: America/Los_Angeles
#  # Gerlach, Nevada
#  latitude_deg: 40.6518
#  longitude_deg: -119.3562
#  altitude_m: 1200.0
#  timezone_id: America/Los_Angeles

# Absorber center O is the world origin XY, at center_height_m on Z.
absorber:
  width_m: 0.40
  height_m: 0.40
  center_height_m: 1.0
  # Oven / absorber face normal in the horizontal plane.
  # 0° = +X east, 90° = +Y north. Changing this rotates the whole plant.
  normal_angle_from_x_deg: 90.0

mirror:
  # Faceted spherical assembly on one alt-az mount
  grid_nx: 3
  grid_ny: 5
  tile_side_m: 0.254
  pitch_m: 0.26035            # tile_side + 0.0254/4
  mount_offset_d_m: 0.1       # |An Mn| along mirror-frame Z (offset between mirrror surface andmount rotation point)
  radius_of_curvature_m: 5.5  # design sphere radius (paraxial focal length ≈ R/2)
  default_oa_distance_m: 2.5  # |O An| horizontal design distance
  default_mount_height_m: 1.0 # An height above ground (world Z)

fleet:
  assembly_count: 3
  # Center-to-center spacing between assemblies along an arc / line [m]
  assembly_spacing_m: 1.0
  # Design layout: mounts on a horizontal arc in front of the oven back.
  # bearing_deg is relative to absorber.normal_angle_from_x_deg:
  #   0 = straight out along the oven normal; +CCW about +Z (up).
  mounts:
    - node_id: 0
      bearing_deg: 0.0
      oa_distance_m: 2.5
      mount_height_m: 1.0
    - node_id: 1
      bearing_deg: -30.0
      oa_distance_m: 2.5
      mount_height_m: 1.0
    - node_id: 2
      bearing_deg: 30.0
      oa_distance_m: 2.5
      mount_height_m: 1.0

control:
  # Face-up stow: elevation 90° (zenith). Azimuth is filled per-node with oven-facing
  # at runtime so each mount parks with relative az = 0 (center of travel).
  # Elevation is astronomical: 0° = horizon, 90° = zenith.
  # Azimuth is astronomical: 0° = north, 90° = east (CW from north).
  safe_park_azimuth_deg: 0.0
  safe_park_elevation_deg: 90.0
  # When the oven is not requesting heat, Track mirrors aim this far above the absorber
  # center (world +Z) instead of focusing on the absorber.
  idle_aim_height_above_absorber_m: 2.0
  # When true, solve for mount_offset_d_m via least squares after the bisector seed.
  # Set false to use the pivot-bisector seed only (useful for A/B testing).
  solve_for_mount_offset: true
  # Physical mount travel. Azimuth is relative to oven-facing (0 = aim at absorber at el→0).
  elevation_min_deg: 0.0
  elevation_max_deg: 90.0
  azimuth_min_deg: -150.0
  azimuth_max_deg: 150.0

actuator:
  # ── Encoder / gearbox ────────────────────────────────────────────────────────
  # Encoder is on the motor shaft BEFORE both reduction stages.
  # ticks_per_degree = (encoder_ppr × 4) × motor_gear_ratio × worm_gear_ratio / 360
  encoder_ppr: 16              # Pulses per revolution of the motor shaft (single-channel edges)
  motor_gear_ratio: 70.0       # Motor gearbox (motor shaft → intermediate)
  worm_gear_ratio: 120.0       # Mount worm drive (intermediate → output / mount shaft)
  # Overall gear_ratio = motor_gear_ratio × worm_gear_ratio (derived in code)

  # ── Velocity limits ───────────────────────────────────────────────────────────
  max_velocity_deg_s: 5.0    # Maximum output-shaft speed [°/s]
  max_accel_deg_s2: 10.0     # Maximum output-shaft acceleration [°/s²] (firmware ramp limiter)

  # ── Homing (single speed across both hall edges) ─────────────────────────────
  # If already on the hall, back up (−encoder) until clear. Then move at constant
  # speed in the +encoder direction, capture rising + falling edges, redefine zero
  # at the midpoint, and set_target to home so the axis drives back to center.
  homing_velocity_deg_s: 3.0   # Constant home seek speed [°/s] — tune as needed

  # ── PID (duty command u ∈ [-1,1]: kp*error + ki*∫error + kd*derror/dt) ──────
  # Same gains for azimuth and elevation. Override at runtime with set_pid.
  pid_kp: 20.0
  pid_ki: 50.0
  pid_kd: 1.0
  # Cap |ki·∫e| so the integrator cannot own more than this fraction of full duty.
  # Keeps windup from large slews from overshooting once the error reverses.
  pid_integral_limit: 0.1
  # Duty below this is forced to 0 (both H-bridge legs off) to save power near target.
  pwm_deadband: 0.05
  # |position error| below this → PWM off and freeze I (no integrate; keep value).
  position_deadband_deg: 0.01

  # ── SITL physics ─────────────────────────────────────────────────────────────
  # First-order lag approximating motor electrical + mechanical inertia.
  # velocity_time_constant_s = J_total / (Kt * Ke / R + b)  (rough lumped model)
  velocity_time_constant_s: 0.2  # [s]

  # ── Stall detection ──────────────────────────────────────────────────────────
  # Set stall_timeout_s to 0 (or negative) to disable stall faults while tuning PID.
  stall_velocity_threshold_deg_s: 0.05  # |ω| < this while |cmd| is large → stalling [°/s]
  stall_timeout_s: 0.0                  # 0 = disabled; e.g. 1.0 to re-enable after bring-up [s]

  # ── Control loop ─────────────────────────────────────────────────────────────
  control_period_s: 0.02  # Firmware ISR / control loop period (50 Hz) [s]

# Arduino Nano ESP32 pin roles for firmware.
# Labels are Arduino D#/A# names (firmware remaps them to ESP32 GPIO numbers).
# Swap *_enc_a / *_enc_b on an axis to invert encoder direction without rewiring.
# Physical silk / harness map: electrical/pinouts.txt (ENC_A yellow → D5, etc.).
# Regenerate firmware header after edits: uv run hotbox-gen-firmware-geometry
pins:
  can_tx: D10
  can_rx: D9
  elevation_motor_p: A1
  elevation_motor_m: A0
  # A/B swapped vs electrical/pinouts.txt silk (yellow/white) for correct sense.
  elevation_enc_a: D5
  elevation_enc_b: D6
  elevation_hall: D7
  azimuth_motor_p: A2
  azimuth_motor_m: A3
  azimuth_enc_a: D3
  azimuth_enc_b: D2
  azimuth_hall: D4
  motor_pwm_hz: 20000
